name: Coolify Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '22'

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to Coolify
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify Webhook
        run: |
          # Try multiple webhook endpoints for redundancy
          ENDPOINTS=(
            "${{ secrets.COOLIFY_WEBHOOK_URL }}"
            "${{ secrets.COOLIFY_WEBHOOK_URL_ALT }}"
          )
          
          for ENDPOINT in "${ENDPOINTS[@]}"; do
            if [ -n "$ENDPOINT" ]; then
              echo "Trying webhook: ${ENDPOINT:0:50}..."
              curl -sfSL -X POST "$ENDPOINT" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
                -d '{
                  "repository": "${{ github.repository }}",
                  "commit": "${{ github.sha }}",
                  "ref": "${{ github.ref }}",
                  "images": {
                    "api": "ghcr.io/${{ github.repository }}/api:${{ github.sha }}",
                    "web": "ghcr.io/${{ github.repository }}/web:${{ github.sha }}"
                  }
                }' && echo "✅ Webhook triggered successfully" && exit 0
            fi
          done
          
          echo "⚠️ All webhooks failed, but images are pushed to registry"
          exit 0
        continue-on-error: true

      - name: Notify Deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            🚀 *Deployment ${{ job.status }}*
            
            Images pushed to GHCR:
            • API: `ghcr.io/${{ github.repository }}/api:${{ github.sha }}`
            • Web: `ghcr.io/${{ github.repository }}/web:${{ github.sha }}`
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
